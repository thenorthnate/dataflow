        } else {
          var px = h('input', { type: 'number', class: 'ed-input ed-num', id: 'ed-node-x', 'aria-label': 'x', step: 1,
            value: n.position ? String(n.position.x) : '' });
          var py = h('input', { type: 'number', class: 'ed-input ed-num', id: 'ed-node-y', 'aria-label': 'y', step: 1,
            value: n.position ? String(n.position.y) : '' });
          var commitPosition = function () {
            var x = px.value.trim(), y = py.value.trim();
            var err = null;
            if (x === '' && y === '') delete n.position;
            else if (x === '' || y === '') err = 'Give both x and y, or neither.';
            else put(n, 'position', { x: Number(x), y: Number(y) });
            showError(px, err);
            showError(py, err);
            if (!err) changed();
          };
          px.addEventListener('change', commitPosition);
          py.addEventListener('change', commitPosition);
          position = h('div', { class: 'ed-inline' }, ['x', px, 'y', py]);
        }

        var exclude = descendantsOf(n);
        formBox.append(
          h('h3', null, [title, group ? h('span', { class: 'ed-badge', text: 'group' }) : null]),
          field('Id', textInput(n.id, function (v) { return renameNode(n, v); }, { id: 'ed-node-id' }),
            'Must be unique. Renaming updates every edge and group member that refers to it.'),
          field('Label', textInput(n.label, function (v) {
            if (v) put(n, 'label', v); else delete n.label;
            retitle();
            renderNodeList();
          }, { id: 'ed-node-label', placeholder: n.id !== undefined ? String(n.id) : '' }), 'Defaults to the id.'),
          field('Type', selectInput(typeOptions(graph.nodeTypes), n.type, function (v) {
            if (v) put(n, 'type', v); else delete n.type;
            renderNodeList();
          }, { id: 'ed-node-type' }), group ? 'A group is drawn as a box whatever its type.' : null),
          field('Group', selectInput([{ value: '', label: '(none)' }].concat(nodeOptions(function (m) { return exclude.has(m); })),
            n.parent, function (v) { setParent(n, v); }, { id: 'ed-node-parent' })),
          field('Position', position),
          field('Tags', tagChips(n)),
          field('Details', detailsEditor(n)),
          h('div', { class: 'ed-actions' }, [
            h('button', { type: 'button', class: 'ed-btn', id: 'ed-node-show', disabled: n.id === undefined,
              onclick: function () { showInDiagram(n.id); } }, ['Show in diagram']),
            h('button', { type: 'button', class: 'ed-btn', id: 'ed-node-duplicate', onclick: function () { duplicateNode(n); } }, ['Duplicate']),
            h('button', { type: 'button', class: 'ed-btn danger', id: 'ed-node-delete', onclick: function () { deleteNode(n); } }, ['Delete node'])
          ])
        );
      }

      function renameNode(n, to) {
        if (!to) return 'An id is required.';
        if (nodeIdTaken(to)) return 'Another node already has the id “' + to + '”.';
        var from = n.id;
        if (from !== undefined) {
          liveEdges().forEach(function (e) {
            if (e.source === from) e.source = to;
            if (e.target === from) e.target = to;
          });
          liveNodes().forEach(function (m) { if (m !== n && m.parent === from) m.parent = to; });
        }
        n.id = to;
        renderNodeList();
      }

      // A node that gains its first member stops being drawn as a node and
      // starts being sized around its members, so the position it had as a
      // leaf is dropped; a group that loses its last member becomes a leaf
      // again and needs one.
      function setParent(n, v) {
        var before = n.parent !== undefined ? nodeById(n.parent) : null;
        var after = v ? nodeById(v) : null;
        if (after && !isGroup(after)) delete after.position;
        if (v) put(n, 'parent', v); else delete n.parent;
        placeIfLeaf(before);
        renderNodeList();
      }

      function addNode() {
        var types = Object.keys(graph.nodeTypes);
        var n = { id: uniqueName('new-service', nodeIdTaken), label: 'New service' };
        if (types.length) n.type = types[0];
        n.position = nextPosition();
        graph.nodes.push(n);
        currentNode = n;
        nodeFilter = '';
        changed();
        renderSection();
        var id = document.getElementById('ed-node-label');
        if (id) { id.focus(); id.select(); }
      }

      function addGroup() {
        // Positioned like any leaf until something joins it; see setParent().
        var n = { id: uniqueName('new-group', nodeIdTaken), label: 'New group', position: nextPosition() };
        graph.nodes.push(n);
        currentNode = n;
        nodeFilter = '';
        changed();
        renderSection();
      }

      function duplicateNode(n) {
        var copy = JSON.parse(JSON.stringify(n));
        copy.id = uniqueName(String(n.id) + '-copy', nodeIdTaken);
        if (copy.label) copy.label += ' (copy)';
        if (isGroup(n)) delete copy.position;
        if (copy.position) copy.position = { x: copy.position.x + 40, y: copy.position.y + 40 };
        else placeIfLeaf(copy);
        graph.nodes.splice(graph.nodes.indexOf(n) + 1, 0, copy);
        currentNode = copy;
        changed();
        renderSection();
      }

      function deleteNode(n) {
        var flows = liveEdges().filter(function (e) { return e.source === n.id || e.target === n.id; });
        var members = liveNodes().filter(function (m) { return m !== n && m.parent === n.id; });
        var consequences = [];
        if (flows.length) consequences.push(plural(flows.length, 'connected edge') + ' will be deleted with it');
        if (members.length) consequences.push(plural(members.length, 'member') + ' will be moved out of the group');
        if (!window.confirm('Delete “' + (n.label || n.id) + '”?' +
            (consequences.length ? ' ' + consequences.join(', and ') + '.' : ''))) return;
        flows.forEach(function (e) { graph.edges.splice(graph.edges.indexOf(e), 1); });
        members.forEach(function (m) { delete m.parent; placeIfLeaf(m); });
        var parent = n.parent !== undefined ? nodeById(n.parent) : null;
        graph.nodes.splice(graph.nodes.indexOf(n), 1);
        placeIfLeaf(parent);
        if (flows.indexOf(currentEdge) !== -1) currentEdge = null;
        currentNode = null;
        changed();
        renderSection();
      }

      // ---------- edges ----------
      function renderEdges() {
        if (currentEdge && graph.edges.indexOf(currentEdge) === -1) currentEdge = null;
        if (!currentEdge) currentEdge = liveEdges()[0] || null;
        listBox = h('div', { class: 'ed-list', id: 'ed-edge-list' });
        formBox = h('div', { class: 'ed-form', id: 'ed-edge-form' });
        renderEdgeList();
        renderEdgeForm();
        return heading('Edges', 'The flows between nodes. An edge’s type sets how it is drawn.').concat([
          h('div', { class: 'ed-split' }, [
            h('div', { class: 'ed-master' }, [
              h('div', { class: 'ed-list-tools' }, [
                filterInput('ed-edge-filter', edgeFilter, function (q) { edgeFilter = q; renderEdgeList(); }, 'Filter edges…'),
                h('button', { type: 'button', class: 'ed-btn', id: 'ed-add-edge', disabled: !nodeOptions().length,
                  title: nodeOptions().length ? null : 'Add a node first', onclick: addEdge }, ['+ Add edge'])
              ]),
              listBox
            ]),
            formBox
          ])
        ]);
      }

      function edgeTitle(e) { return nodeName(e.source) + ' → ' + nodeName(e.target); }

      function renderEdgeList() {
        listBox.replaceChildren();
        var rows = liveEdges().filter(function (e) {
          if (!edgeFilter) return true;
          return [e.id, e.label, e.source, e.target, nodeName(e.source), nodeName(e.target)].join(' ').toLowerCase().indexOf(edgeFilter) !== -1;
        });
        if (!rows.length) {
          listBox.appendChild(h('div', { class: 'ed-empty', text: graph.edges.length ? 'No edges match.' : 'No edges yet.' }));
          return;
        }
        rows.forEach(function (e) {
          var cfg = graph.edgeTypes[e.type];
          listBox.appendChild(listRow(e === currentEdge, function () { currentEdge = e; renderEdgeList(); renderEdgeForm(); }, [
            swatch(cfg ? cfg.color : '#c4c8d0', false),
            h('span', { class: 'ed-row-label', text: edgeTitle(e) }),
            h('span', { class: 'ed-row-id', text: e.label || '' })
          ], { 'data-id': e.id !== undefined ? String(e.id) : '' }));
        });
        var active = listBox.querySelector('.ed-row.active');
        if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
      }

      function renderEdgeForm() {
        var e = currentEdge;
        formBox.replaceChildren();
        if (!e) {
          formBox.appendChild(h('p', { class: 'ed-muted', text: graph.edges.length ? 'Select an edge to edit it.' : 'No edges yet — add one to connect two nodes.' }));
          return;
        }
        var title = h('span', { text: e.label || edgeTitle(e) });
        function retitle() { title.textContent = e.label || edgeTitle(e); renderEdgeList(); }
        var endpoints = nodeOptions();

        formBox.append(
          h('h3', null, [title]),
          field('Id', textInput(e.id, function (v) {
            if (!v) return 'An id is required.';
            if (edgeIdTaken(v)) return 'Another edge already has the id “' + v + '”.';
            e.id = v;
            renderEdgeList();
          }, { id: 'ed-edge-id' }), 'Must be unique.'),
          field('From', h('div', { class: 'ed-inline' }, [
            selectInput(endpoints, e.source, function (v) { e.source = v; retitle(); }, { id: 'ed-edge-source', 'aria-label': 'From' }),
            h('button', { type: 'button', class: 'ed-btn icon', id: 'ed-edge-swap', title: 'Swap direction', 'aria-label': 'Swap direction',
              onclick: function () {
                var s = e.source; e.source = e.target; e.target = s;
                changed();
                renderEdgeForm();
                renderEdgeList();
              } }, ['⇅'])
          ])),
          field('To', selectInput(endpoints, e.target, function (v) { e.target = v; retitle(); }, { id: 'ed-edge-target' })),
          field('Type', selectInput(typeOptions(graph.edgeTypes), e.type, function (v) {
            if (v) put(e, 'type', v); else delete e.type;
            renderEdgeList();
          }, { id: 'ed-edge-type' })),
          field('Label', textInput(e.label, function (v) {
            if (v) put(e, 'label', v); else delete e.label;
            retitle();
          }, { id: 'ed-edge-label' }), 'Shown on the line when it lights up.'),
          field('Tags', tagChips(e)),
          field('Details', detailsEditor(e)),
          h('div', { class: 'ed-actions' }, [
            h('button', { type: 'button', class: 'ed-btn', id: 'ed-edge-show', disabled: e.id === undefined,
              onclick: function () { showInDiagram(e.id); } }, ['Show in diagram']),
            h('button', { type: 'button', class: 'ed-btn danger', id: 'ed-edge-delete', onclick: function () { deleteEdge(e); } }, ['Delete edge'])
          ])
        );
      }

      function addEdge() {
        var leaves = liveNodes().filter(function (n) { return n.id !== undefined && !isGroup(n); });
        if (!leaves.length) leaves = liveNodes().filter(function (n) { return n.id !== undefined; });
        if (!leaves.length) return;
        var from = currentNode && currentNode.id !== undefined && leaves.indexOf(currentNode) !== -1 ? currentNode : leaves[0];
        var to = leaves.filter(function (n) { return n !== from; })[0] || from;
        var e = { id: uniqueName('e-' + from.id + '-' + to.id, edgeIdTaken), source: from.id, target: to.id };
        var types = Object.keys(graph.edgeTypes);
        if (types.length) e.type = types[0];
        graph.edges.push(e);
        currentEdge = e;
        edgeFilter = '';
        changed();
        renderSection();
      }

      function deleteEdge(e) {
        if (!window.confirm('Delete the edge “' + (e.label || edgeTitle(e)) + '”?')) return;
        graph.edges.splice(graph.edges.indexOf(e), 1);
        currentEdge = null;
        changed();
        renderSection();
      }

      // ---------- wiring ----------
      diagramBtn.addEventListener('click', exit);
      editBtn.addEventListener('click', enter);
      diagram.onDataCopied(function () { dirty = false; updateToggle(); });
      // Edits live only in this tab until they are copied out, and the dataset
      // picker switches by reloading, so leaving with uncopied edits asks first.
      window.addEventListener('beforeunload', function (evt) {
        if (!dirty) return;
        evt.preventDefault();
        evt.returnValue = '';
      });
      document.getElementById('view-toggle').hidden = false;
      updateToggle();
    }

    boot();
  })();
  </script>

</body>
</html>
